{% extends "main/layout.html" %}
{% load static %}
{% load crispy_forms_tags %}
{% block content %}
<div class="breadcrumb-holder">
	<div class="container-fluid">
		<ul class="breadcrumb">
			<li class="breadcrumb-item"><a href="{% url 'uvip-eval-det' eval.hashed %}">Fila</a></li>
		    <li class="breadcrumb-item active">{{ legend }}</li>
		</ul>
	</div>
</div>
<div class="container-fluid"><br/>
  <div class="row">
		<div class="col-sm-12">
			<div class="card shadow-lg border-info rounded">
				<div class="card-header">{{ legend|upper }}</div>
				<div class="card-body">
                    <table class="table table-sm table-striped">
                        <tr><th>Numeru Referensia ToR</th><th>Naran Projetu</th></tr>
                        <tr><td>{{ eval.number }}</td><td>{{ eval.proj.name }}</td></tr>
                    </table>
                    <hr/>
					{% crispy form %}
				</div> <!--end card-body-->
			</div> <!--end card-->
		</div> <!--end col-->
	</div> <!--end row-->  
</div><!--end cont-->
{% endblock %}
{% block scripts %}
<style>
	#id_project { width: 100%; }
</style>
<script>
	$(document).ready(function() {
    $('#id_project').select2();
});
</script>
{% endblock %}
