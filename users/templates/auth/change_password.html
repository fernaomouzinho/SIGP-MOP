{% extends "main/layout.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="breadcrumb-holder">
	<div class="container-fluid">
		<ul class="breadcrumb">
			<li class="breadcrumb-item active">Atualiza Se&ntilde;a</li>
		</ul>
	</div>
</div>
<div class="container-fluid"><br/>
	<div class="row">
		<div class="col-sm-6">
			<div class="card">
				<div class="card-header">Atualiza Se&ntilde;a</div>
				<div class="card-body">
					<form method="POST">
						{% csrf_token %}
						<fieldset class="form-group">
							{{ form|crispy }}
						</fieldset>
						<div class="form-group d-flex align-items-center justify-content-between mt-4 mb-0">
							<button class="btn btn-success" type="submit">Troka Se&ntilde;a <i class="fa fa-refresh"></i></button>
						</div>
					</form>
				</div>
			</div><!--end card-->
		</div><!--end col-->
	</div><!--end row-->
</div><!--end cont-->
{% endblock content %}
