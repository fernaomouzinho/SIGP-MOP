{% extends "main/layout.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="breadcrumb-holder">
	<div class="container-fluid">
		<ul class="breadcrumb">
			<li class="breadcrumb-item active">{{ legend }}</li>
		</ul>
	</div>
</div>
<div class="container-fluid"><br/>
	<div class="row">
		<div class="col-sm-6">
			<div class="card">
				<div class="card-header">{{ legend }}</div>
				<div class="card-body">
					<table class="table table-sm">
						<tr>
							<td>Username</td>
							<td>: {{ user.username }}</td>
						</tr>
						<tr>
							<td>Email</td>
							<td>: {{ user.email }}</td>
						</tr>
					</table>
				</div>
				<div class="card-footer">
					<div class="small"><a class="btn btn-sm btn-info" href="{% url 'user-change-password' %}">Troka Se&ntilde;a!</a></div>
				</div>
			</div><!--end card-->
		</div><!--end col-->
		<div class="col-sm-6">
			<div class="card">
				<div class="card-header">Atualiza Konta</div>
				<div class="card-body">
					<fieldset class="form-group">
						{% crispy u_form %}
					</fieldset>
					<hr/>
					<div class="alert alert-warning">
						Favor prenxe email ne'eb&eacute; validu.
					</div>
				</div>
			</div><!--end card-->
		</div><!--end col-->
	</div><!--end row-->
</div><!--end cont-->
{% endblock %}
{% block scripts %}
{% endblock %}
