{% extends "main/layout.html" %}
{% load static %}
{% load crispy_forms_tags %}
{% block content %}
<div class="breadcrumb-holder">
	<div class="container-fluid">
		<ul class="breadcrumb">
			{% if group == 'sec' %}
			<li class="breadcrumb-item"><a href="{% url 'sec-insp-det' insp.hashed %}">Fila</a></li>
			{% elif group == 'eng' %}
			<li class="breadcrumb-item"><a href="{% url 'eng-insp-det' insp.hashed %}">Fila</a></li>
			{% endif %}
			<li class="breadcrumb-item active">{{ legend }}</li>
		</ul>
	</div>
</div>
<div class="container-fluid"><br/>
  <div class="row">
		<div class="col-sm-12">
			<div class="card">
				<div class="card-header">{{ legend }}</div>
				<div class="card-body">
					{% crispy form %}
				</div> <!--end card-body-->
			</div> <!--end card-->
		</div> <!--end col-->
	</div> <!--end row-->  
</div><!--end cont-->
{% endblock %}
{% block scripts %}
<style>
	#id_to { width: 100%; }
</style>
<script>
	$(document).ready(function() {
    $('#id_to').select2();
});
</script>
{% endblock %}
