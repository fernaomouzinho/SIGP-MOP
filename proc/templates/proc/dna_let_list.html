{% extends "main/layout.html" %}
{% load static %}
{% block content %}
<div class="breadcrumb-holder">
  <div class="container-fluid">
    <ul class="breadcrumb">
      <li class="breadcrumb-item active">{{ legend }}</li>
    </ul>
  </div>
</div>
<div class="container-fluid"><br/>
  <div class="row">
    <div class="col-sm-12">
      <div class="card">
        <div class="card-header">{{ legend|upper }}</div>
        <div class="card-body">
          <table class="table datatable" id="example" width="100%" cellspacing="0">
            <thead>
            <tr>
              <th>Nu.</th><th>Projetu</th><th>Data Tender</th>
            </tr>
            </thead>
            <tbody>
            {% for obj in objects %}
            <tr>
              <td>{{ forloop.counter }}</td>
              <td><a href="{% url 'dna-proc-let-det' obj.hashed %}">{{ obj.project.name }}</a></td>
              <td>{{ obj.datetime|date:"d/m/Y" }}</td>
            </tr>
            {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
    </div><!--end col-->
  </div><!--end row-->
</div><!--end cont-->
{% endblock %}
{% block scripts %}
<script type="text/javascript">
  $(document).ready(function() {
    $('#example').DataTable();
  } );
</script>
{% endblock %}
