{% extends "main/layout.html" %}
{% load static %}
{% load crispy_forms_tags %}
{% block content %}
<div class="breadcrumb-holder">
	<div class="container-fluid">
		<ul class="breadcrumb">
			<li class="breadcrumb-item"><a href="{% url 'uvip-proj-list' %}">Fila</a></li>
			<li class="breadcrumb-item active">{{ legend }}</li>
		</ul>
	</div>
</div>
<div class="container-fluid"><br/>
	<div class="row">
		<div class="col-sm-12">
			<div class="card">
				<div class="card-header">{{ legend|upper }}</div>
				<div class="card-body">
					<form method="POST" enctype="multipart/form-data">
				        {% csrf_token %}
				        <div class="form-row">
				        	<div class="form-group col-md-12 mb-0">
				        		<label for="fupload"> Upload a file</label>
				        		<input type="file" id="fupload" name="fupload">
				        	</div>
				        </div>
				        <div class="form-row">
				        	<div class="form-group col-md-4 mb-0">
				        		<small>Only accepts CSV files</small>
				        	</div>
				        </div>
				        <div class="form-row">
				        	<div class="form-group col-md-4 mb-0">
				        		<button class="btn btn-primary" type="submit">Importa <i class="fa fa-upload"></i></button>
				        	</div>
				        </div>
				    </form>
			    </div> <!--end card-body-->
		    </div> <!--end card-->
	    </div> <!--end col-->
    </div> <!--end row-->  
</div><!--end cont-->
{% endblock %}
{% block scripts %}
{% endblock %}
