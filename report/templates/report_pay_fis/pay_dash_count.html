{% load humanize %}
<!-- Statistics Section-->
<section class="py-2">
    <div class="container-fluid">
        <div class="row align-items-stretch gy-4">
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-body">
                        <table class="table table-sm">
                            <tr><th><h3>Total Kontratu</h3></th><td><h3>${{ tot_cont|intcomma }}</h3></td></tr>
                            <tr><th><h3>Total Pagamentu</th><td><h3>${{ tot_paid|intcomma }}</h3></td></tr>
                            <tr><th><h3>Balansu</h3></th><td><h3>${{ tot_bal|intcomma }}</h3></td></tr>
                        </table>
                    </div>
                </div>
            </div><!--end col-->
            <div class="col-lg-6">
                <div id="container" style="width: 100%; height: 200px;">
                    <canvas id="paydash_data"></canvas>
                </div>
            </div><!--end col-->
        </div><!--end row-->
    </div><!--end cont-->
</section>
