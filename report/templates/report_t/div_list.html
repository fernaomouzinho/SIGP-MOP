{% extends "main/layout.html" %}
{% load static %}
{% load crispy_forms_tags %}
{% block content %}
<!-- Breadcrumb-->
<div class="breadcrumb-holder">
	<div class="container-fluid">
		<ul class="breadcrumb">
			<li class="breadcrumb-item active">{{ legend|upper }}</li>
		</ul>
	</div>
</div>
<section class="dashboard-counts section-padding">
	<div class="container-fluid">
		<div class="row">
			<div class="col-sm-12">
				<div class="card">
                    <div class="card-header">{{ legend }}</div>
                    <div class="card-body">
                        {% for div in divs %}
                        <a class="btn btn-info m-1" href="{% url 'r-div-proj-dash' div.id %}">{{ div|upper }} <br/>({{ div.code }})</a>
                        {% endfor %}
                    </div>
                </div><!--end card-->
			</div><!--end col-->
		</div><!--end row-->
	</div><!--end cont-->
</section><!--end section-->
{% endblock %}
{% block scripts %}
{% endblock %}
